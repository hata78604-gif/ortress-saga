<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTRESS SAGA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0d0807;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    color: #f0e8c0;
  }

  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #1a1005 0%, #0d0807 60%);
  }

  #stage {
    position: relative;
    height: 100%;
    aspect-ratio: 9 / 16;
    max-width: 100%;
    background: #100a04;
    box-shadow: 0 0 60px rgba(200,169,58,0.12), inset 0 0 120px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px 0;
    pointer-events: none;
    z-index: 5;
  }
  .topline {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: 'Cinzel', serif;
  }
  .wave-tag {
    font-size: 13px;
    letter-spacing: 2px;
    color: #c8a93a;
    text-shadow: 0 0 12px rgba(200,169,58,0.6);
  }
  .wave-num { font-size: 26px; font-weight: 900; line-height: 1; }
  .stat-r { text-align: right; }
  .stat-r .lvl { font-size: 13px; letter-spacing: 2px; color: #e07830; text-shadow: 0 0 12px rgba(224,120,48,0.6);}
  .stat-r .lvl-num { font-size: 26px; font-weight: 900; line-height: 1;}

  /* bars */
  .bar {
    margin-top: 10px;
    height: 7px;
    background: rgba(255,255,255,0.07);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar > i { display:block; height:100%; width:0%; transition: width .12s linear; }
  #hpbar > i { background: linear-gradient(90deg,#8b0000,#cc3300); box-shadow:0 0 10px #8b0000;}
  #xpbar { margin-top:6px; height:5px;}
  #xpbar > i { background: linear-gradient(90deg,#c8a93a,#f0d060); box-shadow:0 0 10px #c8a93a;}

  .barlabel { display:flex; justify-content:space-between; font-size:11px; letter-spacing:1px; margin-top:8px; color:#a89060;}

  /* Level up overlay */
  #levelup {
    position:absolute; inset:0;
    background: rgba(13,8,4,0.85);
    backdrop-filter: blur(3px);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding: 0 24px;
  }
  #levelup.show { display:flex; }
  .lu-title {
    font-family:'Cinzel Decorative',serif;
    font-size: 22px; font-weight:900;
    letter-spacing: 3px;
    color:#c8a93a;
    text-shadow:0 0 20px rgba(200,169,58,0.7);
    margin-bottom: 4px;
  }
  .lu-sub { font-size:13px; letter-spacing:2px; color:#a89060; margin-bottom:26px;}
  .cards { display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px;}
  .card {
    pointer-events:auto;
    cursor:pointer;
    background: linear-gradient(135deg, rgba(60,40,15,0.9), rgba(30,18,5,0.9));
    border:1px solid rgba(200,169,58,0.3);
    border-radius:14px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .card:hover, .card.kbsel {
    transform: translateY(-2px);
    border-color:#c8a93a;
    box-shadow:0 0 24px rgba(200,169,58,0.35);
  }
  .card.selected, .card.selected:hover {
    border-color:#e07830;
    box-shadow:0 0 28px rgba(224,120,48,0.55);
    background: linear-gradient(135deg, rgba(90,55,20,0.95), rgba(45,25,8,0.95));
  }
  .lu-decide:disabled {
    opacity:0.35;
    pointer-events:none;
    cursor:default;
    box-shadow:none;
  }
  .card .ic { font-size:30px; width:42px; text-align:center; }
  .card .body h3 { font-family:'Cinzel',serif; font-size:15px; font-weight:700; letter-spacing:1px; }
  .card .body p { font-size:13px; color:#a89060; margin-top:3px; line-height:1.3; }
  .card .lvtag { margin-left:auto; font-size:11px; font-family:'Cinzel'; color:#e07830; letter-spacing:1px;}

  /* Start / GameOver screens */
  .screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    z-index:30;
    padding:0 30px;
    background: radial-gradient(ellipse at 50% 35%, rgba(40,25,5,0.6), rgba(13,8,4,0.95));
  }
  .screen.hide{ display:none; }
  .game-logo {
    font-family:'Cinzel Decorative',serif;
    font-weight:900;
    font-size: 40px;
    letter-spacing: 4px;
    line-height:1.05;
    background: linear-gradient(90deg,#c8a93a,#e07830,#f0d060);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 0 22px rgba(200,169,58,0.5));
  }
  .tagline { font-size:14px; letter-spacing:3px; color:#a89060; margin-top:8px;}
  .howto { font-size:14px; color:#d4c090; margin-top:26px; line-height:1.7; max-width:300px;}
  .howto b{ color:#c8a93a; }
  .btn {
    margin-top:30px;
    pointer-events:auto;
    cursor:pointer;
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:16px; letter-spacing:3px;
    color:#0d0807;
    background: linear-gradient(90deg,#c8a93a,#e07830);
    border:none;
    padding:15px 40px;
    border-radius:40px;
    box-shadow:0 0 30px rgba(200,169,58,0.5);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover{ transform:scale(1.05); box-shadow:0 0 44px rgba(224,120,48,0.7); }
  .go-title { font-family:'Cinzel Decorative',serif; font-weight:900; font-size:34px; letter-spacing:4px; color:#cc2222; text-shadow:0 0 24px rgba(204,34,34,0.6);}
  .go-win { color:#c8a93a; text-shadow:0 0 24px rgba(200,169,58,0.6);}
  .go-stats{ font-size:16px; color:#d4c090; margin-top:18px; line-height:1.8;}
  .go-stats b{ color:#c8a93a; font-family:'Cinzel'; }
  .hint { font-size:12px; color:#5a4820; margin-top:18px; letter-spacing:1px;}

  /* status button + screen */
  #statusBtn {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    z-index:6; pointer-events:auto; cursor:pointer;
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px;
    color:#a89060; background:rgba(40,25,8,0.7);
    border:1px solid rgba(200,169,58,0.3); border-radius:20px;
    padding:6px 14px; display:none;
  }
  #statusBtn.show{ display:block; }
  #statusBtn:hover{ color:#c8a93a; border-color:#c8a93a; }

  #statusScreen {
    position:absolute; inset:0; z-index:22;
    background:rgba(13,8,4,0.92); backdrop-filter:blur(4px);
    display:none; flex-direction:column; align-items:center;
    padding:40px 26px; overflow-y:auto;
  }
  #statusScreen.show{ display:flex; }
  .st-title { font-family:'Cinzel Decorative',serif; font-weight:900; font-size:24px; letter-spacing:4px; color:#c8a93a; text-shadow:0 0 18px rgba(200,169,58,0.6); margin-bottom:22px;}
  .st-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; width:100%; max-width:360px; margin-bottom:26px;}
  .st-item { display:flex; justify-content:space-between; padding:9px 12px; background:rgba(60,40,15,0.5); border-radius:9px; border:1px solid rgba(200,169,58,0.15);}
  .st-item .k { font-size:13px; color:#a89060; letter-spacing:1px;}
  .st-item .v { font-size:14px; font-weight:700; font-family:'Cinzel'; color:#f0e8c0;}
  .st-sub { font-size:13px; letter-spacing:3px; color:#e07830; margin-bottom:12px; align-self:flex-start; max-width:360px; width:100%;}
  .st-hist { display:flex; flex-direction:column; gap:7px; width:100%; max-width:360px; margin-bottom:26px;}
  .st-hist .h-row { display:flex; align-items:center; gap:10px; font-size:13px; color:#d4c090;}
  .st-hist .h-ic { font-size:18px; width:24px; text-align:center;}
  .st-hist .h-ct { margin-left:auto; font-family:'Cinzel'; font-size:12px; color:#c8a93a;}
  .st-hist .h-empty { font-size:13px; color:#5a4820; }
  .st-resume { margin-top:0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="topline">
        <div>
          <div class="wave-tag">WAVE</div>
          <div class="wave-num" id="waveNum">1</div>
        </div>
        <div class="stat-r">
          <div class="lvl">LEVEL</div>
          <div class="lvl-num" id="lvlNum">1</div>
        </div>
      </div>
      <div class="barlabel"><span id="hpText">城壁 100 / 100</span><span id="enemyText">魔物 0</span></div>
      <div class="bar" id="hpbar"><i></i></div>
      <div class="bar" id="xpbar"><i></i></div>
    </div>

    <!-- ステータスボタン -->
    <button id="statusBtn">⚔ STATUS</button>

    <!-- ステータス画面 -->
    <div id="statusScreen">
      <div class="st-title">STATUS</div>
      <div class="st-grid" id="statGrid"></div>
      <div class="st-sub">強化履歴</div>
      <div class="st-hist" id="histList"></div>
      <button class="btn st-resume" id="resumeBtn">RESUME</button>
    </div>

    <!-- Level up -->
    <div id="levelup">
      <div class="lu-title">LEVEL UP</div>
      <div class="lu-sub">強化を1つ選べ</div>
      <div class="cards" id="cards"></div>
      <button class="btn lu-decide" id="decideBtn" disabled>DECISION</button>
    </div>

    <!-- Start -->
    <div class="screen" id="startScreen">
      <div class="game-logo">FORTRESS<br>SAGA</div>
      <div class="tagline">DEFEND THE REALM</div>
      <div class="howto">
        <b>タップした方向に自動で攻撃</b>。押したまま動かせば狙いを追える。<br>
        魔物はまっすぐ降りてくる。<b>砦の城壁を守れ</b>。<br>
        ボスの魔法弾は <b>撃ち落とせる</b>。最終ボス撃破で勝利。
      </div>
      <button class="btn" id="startBtn">BATTLE START</button>
      <div class="hint">マウス / タッチ操作対応</div>
    </div>

    <!-- Game over -->
    <div class="screen hide" id="overScreen">
      <div class="go-title" id="goTitle">GAME OVER</div>
      <div class="go-stats" id="goStats"></div>
      <button class="btn" id="retryBtn">RETRY</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const VW = 450, VH = 800;
cv.width = VW; cv.height = VH;

const WALL_Y = VH - 70;

// 背景の星（固定位置・起動時に一度だけ生成）
const STARS = Array.from({length: 45}, () => ({
  x: Math.random() * VW,
  y: Math.random() * VH * 0.58,
  r: Math.random() * 1.4 + 0.3,
  a: Math.random() * 0.5 + 0.25,
  phase: Math.random() * Math.PI * 2,
}));

// ---- HUD refs
const waveNumEl = document.getElementById('waveNum');
const lvlNumEl  = document.getElementById('lvlNum');
const hpTextEl  = document.getElementById('hpText');
const enemyTextEl = document.getElementById('enemyText');
const hpFill = document.querySelector('#hpbar > i');
const xpFill = document.querySelector('#xpbar > i');
const levelupEl = document.getElementById('levelup');
const luTitleEl = levelupEl.querySelector('.lu-title');
const luSubEl   = levelupEl.querySelector('.lu-sub');
const cardsEl = document.getElementById('cards');
const decideBtn = document.getElementById('decideBtn');
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const goTitle = document.getElementById('goTitle');
const goStats = document.getElementById('goStats');
const statusBtn = document.getElementById('statusBtn');
const statusScreen = document.getElementById('statusScreen');
const statGrid = document.getElementById('statGrid');
const histList = document.getElementById('histList');

// ---- input: aim
let aim = { x: 0, y: -1 };
function setAimFromClient(cx, cy){
  const r = cv.getBoundingClientRect();
  const px = (cx - r.left) / r.width * VW;
  let py = (cy - r.top) / r.height * VH;
  if(py > player.y - 4) py = player.y - 4;
  const dx = px - player.x;
  const dy = py - player.y;
  const d = Math.hypot(dx,dy) || 1;
  aim.x = dx/d; aim.y = dy/d;
}
let aiming = false;
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  aiming = true;
  setAimFromClient(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e=>{
  if(aiming) setAimFromClient(e.clientX, e.clientY);
});
window.addEventListener('pointerup', ()=>{ aiming = false; });
window.addEventListener('pointercancel', ()=>{ aiming = false; });

// ---- game state
let player, bullets, enemies, particles, orbs, xpGems;
let state = 'menu';
let waveIndex = 0;
let waveTimer = 0;
let spawnQueue = [];
let spawnTimer = 0;
let kills = 0;
let lastTime = 0;
let bossActive = false;
let startPicksRemaining = 0;

function freshPlayer(){
  return {
    x: VW/2, y: WALL_Y + 28, r: 18,
    hp: 100, maxhp: 100,
    level: 1, xp: 0, xpNeed: 5,
    fireRate: 0.42,
    fireCd: 0,
    damage: 10,
    bulletSpeed: 460,
    bulletPierce: 0,
    multishot: 1,
    spread: 0.10,
    turretCount: 0,
    turretDamage: 8,
    turretCd: [],
    novaLevel: 0,
    novaCd: 0,
    xpGain: 1.0,
    pickupRange: 60,
  };
}

// ---- WAVE定義
const WAVES = [
  {count:8,  hp:20,  speed:42, interval:0.8},
  {count:12, hp:24,  speed:46, interval:0.7},
  {count:16, hp:28,  speed:50, interval:0.6},
  {count:0,  boss:true, bossHp:450, bossSpeed:30, name:'TROLL KING'},
  {count:20, hp:34,  speed:54, interval:0.55},
  {count:24, hp:40,  speed:58, interval:0.5},
  {count:28, hp:46,  speed:62, interval:0.45},
  {count:0,  boss:true, bossHp:1200, bossSpeed:34, name:'LICH'},
  {count:32, hp:54,  speed:66, interval:0.42},
  {count:36, hp:62,  speed:70, interval:0.4},
  {count:0,  boss:true, bossHp:2200, bossSpeed:38, name:'ANCIENT DRAGON', last:true},
];

// ---- UPGRADES pool（ファンタジー調）
const UPGRADES = [
  { id:'rate', icon:'🏹', name:'疾風の弓技', desc:'攻撃間隔を15%短縮', max:6,
    apply:p=>{ p.fireRate *= 0.85; } },
  { id:'dmg', icon:'⚔️', name:'力の祈り', desc:'攻撃力 +6', max:8,
    apply:p=>{ p.damage += 6; } },
  { id:'multi', icon:'🎯', name:'分岐の矢術', desc:'同時発射数 +1', max:2,
    apply:p=>{ p.multishot += 1; } },
  { id:'speed', icon:'💨', name:'飛翔の加護', desc:'弾のスピード +25%', max:4,
    apply:p=>{ p.bulletSpeed *= 1.25; } },
  { id:'turret', icon:'🏰', name:'守護の砲台', desc:'城壁に自動で撃つ砲台 +1', max:5,
    apply:p=>{ p.turretCount += 1; p.turretCd.push(0); } },
  { id:'nova', icon:'✨', name:'魔爆陣', desc:'全方位魔法弾を定期発射/強化', max:5,
    apply:p=>{ p.novaLevel += 1; } },
  { id:'hp', icon:'🛡️', name:'城壁強化', desc:'城壁の耐久 +30 & 30%回復', max:6,
    apply:p=>{ p.maxhp += 30; p.hp = Math.min(p.maxhp, p.hp + p.maxhp*0.3); } },
];
let upgradeCounts = {};

// ---------- helpers
function rand(a,b){ return a + Math.random()*(b-a); }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

function spawnParticles(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(spd*0.3,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),max:0.7,color,r:rand(1.5,3.5)});
  }
}

// ---------- start a wave
function startWave(){
  const w = WAVES[waveIndex];
  if(!w){ win(); return; }
  waveNumEl.textContent = (waveIndex+1);
  spawnQueue = [];
  bossActive = false;
  if(w.boss){
    enemies.push(makeBoss(w));
    bossActive = true;
  } else {
    for(let i=0;i<w.count;i++) spawnQueue.push({hp:w.hp, speed:w.speed});
    spawnTimer = 0;
  }
}

function makeBoss(w){
  return {
    boss:true, name:w.name, last:!!w.last,
    x: VW/2, y: -80, r: 46,
    hp: w.bossHp, maxhp: w.bossHp,
    speed: w.bossSpeed,
    shootCd: 0.6,
    xp: 40,
  };
}

function makeEnemy(spec){
  const lane = rand(40, VW-40);
  return {
    x: lane, y: -30, lane,
    r: 14, hp: spec.hp, maxhp: spec.hp,
    speed: spec.speed * rand(0.85,1.15),
    sway: rand(0, Math.PI*2),
    xp: 2,
  };
}

// ---------- shooting
function fire(){
  const base = Math.atan2(aim.y, aim.x);
  const n = player.multishot;
  for(let i=0;i<n;i++){
    const off = (i-(n-1)/2) * player.spread;
    const a = base + off;
    bullets.push({
      x: player.x + aim.x*player.r,
      y: player.y + aim.y*player.r,
      vx: Math.cos(a)*player.bulletSpeed,
      vy: Math.sin(a)*player.bulletSpeed,
      r:5, dmg:player.damage, pierce:player.bulletPierce, hit:[],
    });
  }
}
function fireNova(){
  const n = 6 + player.novaLevel*3;
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    bullets.push({
      x:player.x, y:player.y,
      vx:Math.cos(a)*320, vy:Math.sin(a)*320,
      r:4, dmg:player.damage*0.8, pierce:1, hit:[], nova:true,
    });
  }
  spawnParticles(player.x, player.y, '#8b5cf6', 14, 160);
}

// ---------- xp / level
function gainXp(amount){
  player.xp += amount * player.xpGain;
  while(player.xp >= player.xpNeed){
    player.xp -= player.xpNeed;
    player.level++;
    player.xpNeed = Math.floor(player.xpNeed * 1.25 + 2);
    openLevelUp();
  }
}

function openLevelUp(){
  state = 'levelup';
  if(startPicksRemaining > 0){
    luTitleEl.textContent = '出発の装備';
    luSubEl.textContent   = '戦いの前に強化を1つ選べ';
  } else {
    luTitleEl.textContent = 'LEVEL UP';
    luSubEl.textContent   = '強化を1つ選べ';
  }
  const pool = UPGRADES.filter(u => (upgradeCounts[u.id]||0) < u.max);
  const pick = [];
  const tmp = pool.slice();
  while(pick.length<3 && tmp.length){
    const i = Math.floor(Math.random()*tmp.length);
    pick.push(tmp.splice(i,1)[0]);
  }
  cardsEl.innerHTML = '';
  pick.forEach((u,idx)=>{
    const cur = upgradeCounts[u.id]||0;
    const div = document.createElement('div');
    div.className = 'card' + (idx===0?' kbsel':'');
    div.innerHTML = `<div class="ic">${u.icon}</div>
      <div class="body"><h3>${u.name}</h3><p>${u.desc}</p></div>
      <div class="lvtag">Lv ${cur}→${cur+1}</div>`;
    div.onclick = ()=> selectCard(u, div);
    cardsEl.appendChild(div);
  });
  kbIndex = 0;
  selectedUpgrade = null;
  decideBtn.disabled = true;
  levelupEl.classList.add('show');
}

let selectedUpgrade = null;

function selectCard(u, div){
  selectedUpgrade = u;
  [...cardsEl.children].forEach(c=> c.classList.toggle('selected', c===div));
  decideBtn.disabled = false;
}

decideBtn.onclick = ()=>{
  if(selectedUpgrade) chooseUpgrade(selectedUpgrade);
};

function chooseUpgrade(u){
  u.apply(player);
  upgradeCounts[u.id] = (upgradeCounts[u.id]||0)+1;
  levelupEl.classList.remove('show');
  lvlNumEl.textContent = player.level;

  if(startPicksRemaining > 0){
    startPicksRemaining--;
    if(startPicksRemaining > 0){
      openLevelUp();
    } else {
      state = 'play';
      statusBtn.classList.add('show');
      lastTime = performance.now();
    }
  } else {
    state = 'play';
  }
}

const UPMAP = {};
UPGRADES.forEach(u=> UPMAP[u.id]=u);

// ---------- ステータス画面
function openStatus(){
  if(state!=='play') return;
  state='paused';
  const rate = (1/player.fireRate).toFixed(1);
  const stats = [
    ['ダメージ', player.damage],
    ['連射', rate+' /s'],
    ['弾速', Math.round(player.bulletSpeed)],
    ['同時発射', player.multishot],
    ['砲台数', player.turretCount],
    ['魔爆陣', player.novaLevel],
    ['城壁耐久', Math.ceil(player.hp)+'/'+player.maxhp],
    ['経験値倍率', player.xpGain.toFixed(2)+'x'],
    ['撃破数', kills],
  ];
  statGrid.innerHTML = stats.map(s=>
    `<div class="st-item"><span class="k">${s[0]}</span><span class="v">${s[1]}</span></div>`).join('');
  const hist = Object.keys(upgradeCounts).filter(id=>upgradeCounts[id]>0);
  if(hist.length===0){
    histList.innerHTML = `<div class="h-empty">まだ強化を取得していない</div>`;
  } else {
    histList.innerHTML = hist.map(id=>{
      const u=UPMAP[id];
      return `<div class="h-row"><span class="h-ic">${u.icon}</span><span>${u.name}</span><span class="h-ct">Lv ${upgradeCounts[id]}</span></div>`;
    }).join('');
  }
  statusScreen.classList.add('show');
}
function closeStatus(){
  statusScreen.classList.remove('show');
  state='play';
  lastTime=performance.now();
}
statusBtn.onclick = openStatus;
document.getElementById('resumeBtn').onclick = closeStatus;

let kbIndex = 0;
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(state==='play') openStatus();
    else if(state==='paused') closeStatus();
    return;
  }
  if(state==='levelup'){
    const cards = [...cardsEl.children];
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){ kbIndex=(kbIndex+1)%cards.length; }
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ kbIndex=(kbIndex-1+cards.length)%cards.length; }
    else if(e.key==='Enter'||e.key===' '){
      if(cards[kbIndex].classList.contains('selected')) decideBtn.click();
      else cards[kbIndex].click();
      return;
    }
    cards.forEach((c,i)=>c.classList.toggle('kbsel', i===kbIndex));
  }
});

// ---------- end states

// ---------- reset / start
function resetGame(){
  player = freshPlayer();
  bullets=[]; enemies=[]; particles=[]; xpGems=[];
  waveIndex=0; kills=0; upgradeCounts={};
  waveTimer=0; spawnQueue=[]; spawnTimer=0; bossActive=false;
  lvlNumEl.textContent=1; waveNumEl.textContent=1;
  startWave();
}

document.getElementById('startBtn').onclick = ()=>{
  startScreen.classList.add('hide');

  startPicksRemaining = 2;
  openLevelUp();
};
document.getElementById('retryBtn').onclick = ()=>{
  overScreen.classList.add('hide');
  resetGame();
  startPicksRemaining = 2;
  openLevelUp();
};

// ---------- update（ロジック変更なし）
function update(dt){
  if(state!=='play') return;
  const w = WAVES[waveIndex];

  if(spawnQueue.length){
    spawnTimer -= dt;
    if(spawnTimer<=0){
      enemies.push(makeEnemy(spawnQueue.shift()));
      spawnTimer = w.interval;
    }
  }

  player.fireCd -= dt;
  if(player.fireCd<=0){ fire(); player.fireCd = player.fireRate; }

  if(player.novaLevel>0){
    player.novaCd -= dt;
    if(player.novaCd<=0){ fireNova(); player.novaCd = 2.6; }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<-20||b.x>VW+20||b.y<-20||b.y>VH+20){ bullets.splice(i,1); continue; }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i];

    if(en.proj){
      en.x += en.vx*dt; en.y += en.vy*dt;
      en.life -= dt;
      if(en.life<=0){ enemies.splice(i,1); continue; }
      if(en.x < -20 || en.x > VW+20 || en.y < -20){ enemies.splice(i,1); continue; }
      if(en.y > WALL_Y || dist2(en.x,en.y,player.x,player.y) < (en.r+player.r)*(en.r+player.r)){
        player.hp -= en.dmg;
        enemies.splice(i,1);
        spawnParticles(en.x, Math.min(en.y,WALL_Y), '#cc2222', 8, 140);
        if(player.hp<=0){ player.hp=0; gameOver(); return; }
      }
      continue;
    }

    if(en.boss){
      const stopY = 200;
      if(en.y < stopY){ en.y += en.speed*dt; }
      en.x += Math.sin(performance.now()/900)*40*dt;
      en.x = Math.max(en.r, Math.min(VW-en.r, en.x));
      en.shootCd -= dt;
      if(en.y > 40 && en.shootCd<=0){
        en.shootCd = 1.6;
        const cnt = en.last?7:5;
        const halfSpread = Math.PI*0.20;
        for(let k=0;k<cnt;k++){
          const t = cnt===1 ? 0.5 : k/(cnt-1);
          const a = (Math.PI/2 - halfSpread) + t*(halfSpread*2);
          enemies.push({proj:true, x:en.x, y:en.y, r:7,
            vx:Math.cos(a)*150, vy:Math.sin(a)*150, hp:1, maxhp:1, speed:0, dmg:14, life:8});
        }
      }
    } else {
      en.sway += dt*2;
      en.x = en.lane + Math.sin(en.sway)*22;
      en.y += en.speed*dt;
      if(en.y > WALL_Y){
        player.hp -= 8 + en.maxhp*0.15;
        spawnParticles(en.x, WALL_Y, '#cc2222', 10, 160);
        enemies.splice(i,1);
        if(player.hp<=0){ player.hp=0; gameOver(); return; }
        continue;
      }
    }
  }

  if(player.turretCount>0){
    for(let t=0;t<player.turretCount;t++){
      player.turretCd[t] -= dt;
      if(player.turretCd[t] > 0) continue;
      const tx = (VW/(player.turretCount+1))*(t+1);
      const ty = WALL_Y - 4;
      let target=null, best=1e9;
      for(const en of enemies){
        if(en.proj) continue;
        const d2=dist2(tx,ty,en.x,en.y);
        if(d2<best){ best=d2; target=en; }
      }
      if(target){
        const a=Math.atan2(target.y-ty, target.x-tx);
        bullets.push({x:tx,y:ty,vx:Math.cos(a)*420,vy:Math.sin(a)*420,
          r:4,dmg:player.turretDamage,pierce:0,hit:[],turret:true});
        player.turretCd[t] = 0.7;
      }
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    let removed=false;
    for(let j=enemies.length-1;j>=0;j--){
      const en=enemies[j];
      if(b.hit.includes(en)) continue;
      if(dist2(b.x,b.y,en.x,en.y) < (b.r+en.r)*(b.r+en.r)){
        if(en.proj){
          enemies.splice(j,1);
          spawnParticles(b.x,b.y,'#c060ff',5,120);
          bullets.splice(i,1); removed=true; break;
        }
        en.hp -= b.dmg;
        b.hit.push(en);
        spawnParticles(b.x,b.y,'#e8c040',4,120);
        if(b.pierce<=0){ bullets.splice(i,1); removed=true; }
        else { b.pierce--; }
        if(removed) break;
      }
    }
  }

  for(let j=enemies.length-1;j>=0;j--){
    const en=enemies[j];
    if(en.proj) continue;
    if(en.hp<=0){
      kills++;
      spawnParticles(en.x,en.y, en.boss?'#e07830':'#ffd700', en.boss?40:10, en.boss?260:160);
      for(let g=0; g<(en.boss?12:1); g++){
        xpGems.push({x:en.x+rand(-20,20), y:en.y+rand(-20,20), r:5, v:en.boss? 4 : 1});
      }
      enemies.splice(j,1);
    }
  }

  for(let i=xpGems.length-1;i>=0;i--){
    const g=xpGems[i];
    const dx=player.x-g.x, dy=player.y-g.y;
    const d=Math.hypot(dx,dy)||1;
    const speed = d < player.pickupRange ? Math.min(620, d*7) : 200;
    g.x += dx/d*speed*dt;
    g.y += dy/d*speed*dt;
    if(d < player.r+8){ gainXp(g.v); xpGems.splice(i,1); }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }

  const aliveReal = enemies.some(e=>!e.proj);
  if(spawnQueue.length===0 && !aliveReal){
    waveTimer += dt;
    if(waveTimer>1.0){
      waveTimer=0; waveIndex++;
      if(waveIndex>=WAVES.length){ win(); return; }
      startWave();
    }
  }

  hpFill.style.width = (player.hp/player.maxhp*100)+'%';
  xpFill.style.width = (player.xp/player.xpNeed*100)+'%';
  hpTextEl.textContent = `城壁 ${Math.ceil(player.hp)} / ${player.maxhp}`;
  enemyTextEl.textContent = bossActive? `BOSS` : `魔物 ${aliveReal? enemies.filter(e=>!e.proj).length : spawnQueue.length}`;
}

// ---------- draw helpers

function drawGoblin(x, y, r, hpRatio){
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = '#2a5a2a'; ctx.shadowBlur = 8;

  // 体
  ctx.fillStyle = '#3d7a3d';
  ctx.beginPath();
  ctx.ellipse(0, 4, r*0.65, r*0.7, 0, 0, Math.PI*2);
  ctx.fill();

  // 頭
  ctx.fillStyle = '#4a9a4a';
  ctx.beginPath();
  ctx.arc(0, -r*0.5, r*0.6, 0, Math.PI*2);
  ctx.fill();

  // とがった耳
  ctx.fillStyle = '#3a7a3a';
  ctx.beginPath();
  ctx.moveTo(-r*0.55, -r*0.6); ctx.lineTo(-r*1.0, -r*1.15); ctx.lineTo(-r*0.2, -r*0.85);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r*0.55, -r*0.6); ctx.lineTo(r*1.0, -r*1.15); ctx.lineTo(r*0.2, -r*0.85);
  ctx.closePath(); ctx.fill();

  // 目
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffdd00';
  ctx.beginPath(); ctx.arc(-r*0.22, -r*0.55, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.22, -r*0.55, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-r*0.22, -r*0.55, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.22, -r*0.55, r*0.08, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  // HPバー
  if(hpRatio < 1){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x-14, y-r-7, 28, 3);
    ctx.fillStyle = '#cc2222'; ctx.fillRect(x-14, y-r-7, 28*hpRatio, 3);
  }
}

function drawDragon(x, y, r){

  ctx.lineTo(r*1.2, -r*0.1);

  ctx.quadraticCurveTo(r*0.75, -r*1.35, r*0.15, -r*1.05);

  ctx.beginPath(); ctx.arc( r*0.2, -r*0.5, r*0.11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.arc(-r*0.2, -r*0.5, r*0.055, 0, Math.PI*2); ctx.fill();

// ---------- draw
function draw(){
  ctx.clearRect(0,0,VW,VH);

  // 夜空の背景グラデーション
  const skyGrad = ctx.createLinearGradient(0, 0, 0, VH * 0.75);
  skyGrad.addColorStop(0, '#050308');
  skyGrad.addColorStop(1, '#100a04');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, VW, VH);

  // 地面エリア
  ctx.fillStyle = '#0a0804';
  ctx.fillRect(0, VH * 0.72, VW, VH * 0.28);

  // 星
  const t = performance.now() / 1000;
  for(const s of STARS){
    ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(t * 0.8 + s.phase));
    ctx.fillStyle = '#f0e8c0';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 薄い石畳グリッド
  ctx.strokeStyle = 'rgba(180,150,80,0.05)'; ctx.lineWidth = 1;
  for(let x=0;x<=VW;x+=45){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,VH); ctx.stroke(); }
  for(let y=0;y<=VH;y+=45){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VW,y); ctx.stroke(); }

  if(state==='menu') return;

  // 城壁ライン（石造り）
  const wallGrad = ctx.createLinearGradient(0, WALL_Y, 0, VH);
  wallGrad.addColorStop(0, 'rgba(140,115,60,0.28)');
  wallGrad.addColorStop(1, 'rgba(80,55,20,0.15)');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, WALL_Y, VW, VH - WALL_Y);

  // 城壁のトップライン
  ctx.strokeStyle = 'rgba(180,150,80,0.85)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#c8a93a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(0,WALL_Y); ctx.lineTo(VW,WALL_Y); ctx.stroke();
  ctx.shadowBlur = 0;

  // 城壁の胸壁（凹凸）
  ctx.fillStyle = 'rgba(160,130,70,0.7)';
  const bW = 22, bH = 14, bGap = 9;
  for(let x = 2; x < VW; x += bW + bGap){
    ctx.fillRect(x, WALL_Y - bH, bW, bH);
  }
  // 胸壁の輪郭
  ctx.strokeStyle = 'rgba(200,170,90,0.5)'; ctx.lineWidth = 1;
  for(let x = 2; x < VW; x += bW + bGap){
    ctx.strokeRect(x, WALL_Y - bH, bW, bH);
  }

  // xp gems（金貨）
  for(const g of xpGems){
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#c8a93a';
    ctx.beginPath(); ctx.arc(0, 0, g.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f5e070';
    ctx.beginPath(); ctx.arc(-g.r*0.25, -g.r*0.25, g.r*0.45, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // enemies
  for(const en of enemies){
    if(en.proj){
      // ボスの魔法弾
      ctx.fillStyle = '#4a0080';
      ctx.shadowColor = '#9b50ff'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#c050ff';
      ctx.beginPath(); ctx.arc(en.x - en.r*0.3, en.y - en.r*0.3, en.r*0.4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      continue;
    }
    if(en.boss){
      if(en.name === 'TROLL KING')       drawTrollKing(en.x, en.y, en.r);
      else if(en.name === 'LICH')        drawLich(en.x, en.y, en.r);
      else                               drawDragon(en.x, en.y, en.r);

      // ボスHPバー
      const bw = 200, bh = 10, by = 110;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(VW/2-bw/2, by, bw, bh);
      // バーの色をボス種別で変える
      ctx.fillStyle = en.name==='TROLL KING' ? '#4a9a3a' : en.name==='LICH' ? '#8b5cf6' : '#cc2200';
      ctx.fillRect(VW/2-bw/2, by, bw*(en.hp/en.maxhp), bh);
      ctx.strokeStyle = 'rgba(200,170,80,0.4)'; ctx.lineWidth = 1;
      ctx.strokeRect(VW/2-bw/2, by, bw, bh);
      ctx.fillStyle = en.name==='TROLL KING' ? '#7adf5a' : en.name==='LICH' ? '#c8a0ff' : '#ff8050';
      ctx.font = 'bold 13px "Cinzel", Georgia, serif'; ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
      ctx.fillText(en.name, VW/2, by - 7);
      ctx.shadowBlur = 0;
    } else {
      drawGoblin(en.x, en.y, en.r, en.hp/en.maxhp);
    }
  }

  // bullets
  for(const b of bullets){
    if(b.nova){
      ctx.fillStyle = '#8b5cf6';
      ctx.shadowColor = '#8b5cf6'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    } else if(b.turret){
      ctx.fillStyle = '#a0a080';
      ctx.shadowColor = '#c0c090'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    } else {
      // プレイヤーの矢（進行方向を向いたひし形）
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#e8c040';
      ctx.shadowColor = '#c8a93a'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(7, 0);
      ctx.lineTo(0, -2.8);
      ctx.lineTo(-5, 0);
      ctx.lineTo(0, 2.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.shadowBlur = 0;

  // 城壁タレット（石造りの砲台）
  if(player && player.turretCount>0){
    for(let t=0;t<player.turretCount;t++){
      const tx = (VW/(player.turretCount+1))*(t+1);
      const ty = WALL_Y - 4;
      ctx.shadowColor = '#c8a93a'; ctx.shadowBlur = 10;
      // 台座
      ctx.fillStyle = '#8b7355';
      ctx.fillRect(tx-8, ty-5, 16, 9);
      ctx.fillStyle = '#a08060';
      ctx.fillRect(tx-10, ty-5, 20, 5);
      // 砲身
      ctx.fillStyle = '#706050';
      ctx.fillRect(tx-2.5, ty-20, 5, 15);
      ctx.fillStyle = '#504030';
      ctx.fillRect(tx-3, ty-22, 6, 5);
    }
    ctx.shadowBlur = 0;
  }

  // プレイヤー（騎士/守護者）
  if(player){
    ctx.save();
    ctx.translate(player.x, player.y);
    const a = Math.atan2(aim.y, aim.x);
    ctx.rotate(a + Math.PI/2);
    ctx.shadowColor = '#c8a93a'; ctx.shadowBlur = 20;

    // マント（後ろ）
    ctx.fillStyle = '#5a3010';
    ctx.beginPath();
    ctx.moveTo(0, -player.r * 1.05);
    ctx.lineTo(player.r * 0.85, player.r * 0.6);
    ctx.lineTo(player.r * 0.45, player.r * 0.95);
    ctx.lineTo(-player.r * 0.45, player.r * 0.95);
    ctx.lineTo(-player.r * 0.85, player.r * 0.6);
    ctx.closePath(); ctx.fill();

    // 鎧本体
    ctx.fillStyle = '#c8a93a';
    ctx.beginPath();
    ctx.moveTo(0, -player.r);
    ctx.lineTo(player.r * 0.65, player.r * 0.45);
    ctx.lineTo(-player.r * 0.65, player.r * 0.45);
    ctx.closePath(); ctx.fill();

    // 盾マーク（中央の白い宝石）
    ctx.fillStyle = '#f5f0e0';
    ctx.beginPath();
    ctx.arc(0, -player.r * 0.15, player.r * 0.27, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore(); ctx.shadowBlur = 0;
  }
}

// ---------- loop
function loop(now){
  const dt = Math.min(0.033, (now-lastTime)/1000) || 0;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
